# 配信対象は public/ の中だけ（allowlist方式）。
#
# 2026-09-09 是正：それ以前はリポジトリ直下をそのまま配信していたため、
# 公開するつもりの無い mockups/ ・ README.md ・ copy-draft.md が
# https://r150works.com/ から HTTP 200 で誰でも読める状態だった（52 タスク327）。
#
# 「公開しないものを1つずつ塞ぐ」（ブラックリスト）ではなく
# 「公開するものだけを public/ へ置く」（allowlist）にしてある。
# ブラックリスト方式は AnpiLog で5回漏れた実績があるため採らない
# （63_開発既知の落とし穴チェックリスト.md「ブラックリストで塞ぐ」類型）。
#
# ★新しく公開したいファイルは public/ の中へ置くこと。
#   直下に置いても配信されない（それが狙いの動作）。
[build]
  publish = "public"
